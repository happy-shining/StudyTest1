
name: Build, Test and Create Installer

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --logger "trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: "**/TestResults/*.trx"

    # --- NSIS インストール ---
    - name: Install NSIS
      run: choco install nsis -y

    - name: Check NSIS path
      run: dir "C:/Program Files (x86)/NSIS"

    # --- NSIS スクリプト実行 ---
    - name: Build installer with NSIS
      working-directory: StudyTest1/Installer
      run: |
        & "C:/Program Files (x86)/NSIS/makensis.exe" "StudyTest1_SetUp.nsi"
        
    # --- Release 作成 ---
    - name: Read current version
      id: version
      run: |
        $version = Get-Content version.txt
        $parts = $version.Split('.')
        $major = [int]$parts[0]
        $minor = [int]$parts[1]
        $patch = [int]$parts[2] + 1
        $newVersion = "$major.$minor.$patch"
        echo "newVersion=$newVersion" >> $env:GITHUB_OUTPUT

    - name: Update version.txt
      run: |
        Set-Content version.txt ${{ steps.version.outputs.newVersion }}
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add version.txt
        git commit -m "Update version to ${{ steps.version.outputs.newVersion }}"
        git push

    - name: Create Versioned Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.newVersion }}
        name: "Version ${{ steps.version.outputs.newVersion }}"
        files: |
          "StudyTest1/Installer/StudyTest1_Setup.exe"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Latest Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: "Latest Build"
        files: |
          "StudyTest1/Installer/StudyTest1_Setup.exe"
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
