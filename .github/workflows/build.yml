name: Build, Test and Create Installer

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --logger "trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: "**/TestResults/*.trx"

    # --- NSIS インストール ---
    - name: Install NSIS
      run: choco install nsis -y

    - name: Check NSIS path
      run: dir "C:/Program Files (x86)/NSIS"

    # --- NSIS スクリプト実行 ---
    - name: Build installer with NSIS
      working-directory: StudyTest1/Installer
      run: "C:/Program Files (x86)/NSIS/makensis.exe StudyTest1_SetUp.nsi"

    # --- Release 作成 ---
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: "Build ${{ github.run_number }}"
        files: "StudyTest1/Installer/StudyTest1_Setup.exe"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}